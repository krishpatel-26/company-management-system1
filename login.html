
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Management | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f5fb;
            color: #172033;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(20, 30, 60, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #5145e5;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid #dce2ed;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #5145e5;
            box-shadow: 0 0 0 3px rgba(81, 69, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #5145e5;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #4035c7;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            color: #dc2626;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            color: #8791a5;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">COMPANY<span>.</span></div>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Sign in to access your company management dashboard.
        </p>

        <form id="loginForm">

            <label for="username">Username</label>

            <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="submit">
                Sign in
            </button>

            <div id="message" role="alert"></div>

        </form>

        <div class="footer">
            Company Management System
        </div>

    </div>

    <script>
        const form = document.getElementById('loginForm');
        const button = document.getElementById('loginButton');
        const message = document.getElementById('message');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            message.textContent = '';
            button.disabled = true;
            button.textContent = 'Signing in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login failed.');
                }

                if (!data.token) {
                    throw new Error('Login response did not contain a token.');
                }

                localStorage.setItem('authToken', data.token);

                window.location.href = '/employees.html';

            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = 'Sign in';
            }
        });
    </script>

</body>
</html>node src/app.js
